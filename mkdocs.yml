site_name: IA Agéntica · Ingeniería de software
site_description: Curso práctico de 90 días para diseñar y orquestar agentes en un pipeline de Jira a CI/CD.
site_author: Curso IA Agéntica

docs_dir: docs
site_dir: site
strict: true

theme:
  name: mkdocs
  locale: es

plugins:
  - search:
      lang:
        - es
        - en

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables

nav:
  - Inicio: index.md
  - Curso de 90 días: curso-90-dias.md
  - Video del plan: video-plan.md
  - Libro (13 capítulos):
      - Introducción: book/README.md
      - Semana 1 · Fundamentos: book/01-fundamentos.md
      - Semana 2 · Contexto y grounding: book/02-contexto-grounding.md
      - Semana 3 · Herramientas y permisos: book/03-herramientas-permisos.md
      - Semana 4 · Jira e historias: book/04-jira-historias.md
      - Semana 5 · Orquestación durable: book/05-orquestacion-durable.md
      - Semana 6 · Multiagente y contratos: book/06-multiagente-contratos.md
      - Semana 7 · Agente de codificación: book/07-agente-codificacion.md
      - Semana 8 · Pruebas en paralelo: book/08-pruebas-paralelo.md
      - Semana 9 · Seguridad: book/09-seguridad.md
      - Semana 10 · Code review: book/10-code-review.md
      - Semana 11 · CI/CD: book/11-cicd.md
      - Semana 12 · Observabilidad y resiliencia: book/12-observabilidad-resiliencia.md
      - Semana 13 · Capstone: book/13-capstone.md
  - Pipeline objetivo: PIPELINE_OBJETIVO.md
  - Autoevaluación: autoevaluacion.md
  - Ejercicios:
      - Índice: examples/README.md
      - Básico · Contexto: examples/01-basic-context-package.md
      - Básico · Criterios: examples/02-basic-acceptance-criteria.md
      - Intermedio · Jira: examples/03-intermediate-jira-trigger.md
      - Intermedio · Pruebas paralelas: examples/04-intermediate-parallel-tests.md
      - Avanzado · Prompt injection: examples/05-advanced-prompt-injection.md
      - Avanzado · Release gates: examples/06-advanced-release-gates.md
